<?xml version="1.0" encoding="UTF-8"?>
<!--
  OGeeZ V2 — Parametric Mouth
  v2.0.0 · 2026-05-09

  ONE source. 12 colors × 5 treatments × 6 motion states = 360 variants.

  USAGE:
    <svg ... data-state="resting" data-treatment="flat"
         style="--mouth-lip: #33EB05;">
    </svg>

  CSS variables exposed:
    --mouth-lip            (default: electric green)
    --mouth-shadow-color   (for duotone treatment)
    --mouth-shadow-x, --mouth-shadow-y (offset)
    --mouth-trail-color    (for motion-trail treatment)

  Fixed accents (NEVER vary): magenta tooth, red tongue, white teeth, black void/airplane.

  States (data-state):
    resting (default) — closed-position
    shouting          — shout-lines emit, staggered
    biting            — airplane animates into mouth
    cycling           — lip color cycles through library
    bleeding          — viewBox pans 30% past edge
    trailing          — motion-trail extends + fades

  Treatments (data-treatment):
    flat (default), duotone-shadow, motion-trail, bleed, photo-mask
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 700"
     class="ogz-mouth"
     data-state="resting"
     data-treatment="flat"
     role="img"
     aria-label="OGeeZ mouth — speech mark with airplane"
     style="--mouth-lip: #33EB05;
            --mouth-shadow-color: transparent;
            --mouth-shadow-x: 0;
            --mouth-shadow-y: 0;
            --mouth-trail-color: transparent;">

  <defs>
    <!-- Photo-mask treatment exposes this clipPath -->
    <clipPath id="mouth-photo-mask">
      <path d="M 200 200 Q 300 130 400 130 Q 500 130 600 200 Q 650 280 600 380 Q 550 480 400 500 Q 250 480 200 380 Q 150 280 200 200 Z"/>
    </clipPath>

    <!-- Reusable lip path for shadow + trail treatments -->
    <symbol id="lip-path" viewBox="0 0 800 700">
      <path d="M 200 200 Q 300 130 400 130 Q 500 130 600 200 Q 700 250 680 360 Q 650 450 580 500 Q 500 560 400 560 Q 300 560 220 500 Q 150 450 120 360 Q 100 250 200 200 Z"/>
    </symbol>
  </defs>

  <!-- ┄┄┄┄┄┄┄┄┄┄ TREATMENT LAYERS (conditional) ┄┄┄┄┄┄┄┄┄┄ -->

  <!-- Duotone shadow (rendered when treatment="duotone-shadow") -->
  <g class="mouth-shadow" style="transform: translate(var(--mouth-shadow-x), var(--mouth-shadow-y));">
    <use href="#lip-path" fill="var(--mouth-shadow-color)" opacity="1"/>
  </g>

  <!-- Motion trail (rendered when treatment="motion-trail" or state="trailing") -->
  <g class="mouth-trail" opacity="0.4">
    <use href="#lip-path" fill="var(--mouth-trail-color)" transform="translate(-40, 30)"/>
    <use href="#lip-path" fill="var(--mouth-trail-color)" transform="translate(-80, 60)" opacity="0.5"/>
    <use href="#lip-path" fill="var(--mouth-trail-color)" transform="translate(-120, 90)" opacity="0.25"/>
  </g>

  <!-- ┄┄┄┄┄┄┄┄┄┄ MOUTH ANATOMY (always rendered) ┄┄┄┄┄┄┄┄┄┄ -->

  <!-- Outer lip silhouette (color-shifts via --mouth-lip) -->
  <g class="mouth-lip">
    <path d="M 200 200 Q 300 130 400 130 Q 500 130 600 200 Q 700 250 680 360 Q 650 450 580 500 Q 500 560 400 560 Q 300 560 220 500 Q 150 450 120 360 Q 100 250 200 200 Z"
          fill="var(--mouth-lip)"/>
  </g>

  <!-- Black void interior (top of mouth) -->
  <g class="mouth-void">
    <path d="M 220 240 Q 320 180 400 180 Q 480 180 580 240 Q 600 290 570 340 L 230 340 Q 200 290 220 240 Z"
          fill="#000000"/>
  </g>

  <!-- Top teeth row -->
  <g class="mouth-teeth-top">
    <rect x="240" y="240" width="320" height="55" fill="#FFFFFF"/>
    <line x1="290" y1="240" x2="290" y2="295" stroke="#000000" stroke-width="2"/>
    <line x1="345" y1="240" x2="345" y2="295" stroke="#000000" stroke-width="2"/>
    <line x1="400" y1="240" x2="400" y2="295" stroke="#000000" stroke-width="2"/>
    <line x1="455" y1="240" x2="455" y2="295" stroke="#000000" stroke-width="2"/>
    <line x1="510" y1="240" x2="510" y2="295" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Magenta-highlighted single tooth (ALWAYS magenta, even on Epink lip) -->
  <g class="mouth-tooth-magenta">
    <rect x="455" y="240" width="55" height="55" fill="#E602BB"/>
  </g>

  <!-- Airplane silhouette (the visual gag — the mouth has bitten an airplane) -->
  <g class="mouth-airplane">
    <path d="M 280 270 L 480 280 L 510 290 L 480 300 L 280 290 Z M 380 240 L 400 270 L 380 270 Z M 380 300 L 400 280 L 380 320 Z"
          fill="#000000"/>
  </g>

  <!-- Tongue (always red) -->
  <g class="mouth-tongue">
    <path d="M 250 360 Q 400 380 550 360 Q 540 460 400 470 Q 260 460 250 360 Z"
          fill="#E33A1F"/>
  </g>

  <!-- Bottom teeth row -->
  <g class="mouth-teeth-bottom">
    <path d="M 240 460 L 560 460 L 540 500 L 260 500 Z" fill="#FFFFFF"/>
    <line x1="290" y1="460" x2="290" y2="500" stroke="#000000" stroke-width="1.5"/>
    <line x1="340" y1="460" x2="340" y2="500" stroke="#000000" stroke-width="1.5"/>
    <line x1="400" y1="460" x2="400" y2="500" stroke="#000000" stroke-width="1.5"/>
    <line x1="460" y1="460" x2="460" y2="500" stroke="#000000" stroke-width="1.5"/>
    <line x1="510" y1="460" x2="510" y2="500" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- Sparkle / star (top-right interior) -->
  <g class="mouth-sparkle">
    <path d="M 530 215 L 545 245 L 575 250 L 545 255 L 530 285 L 515 255 L 485 250 L 515 245 Z"
          fill="#000000"/>
  </g>

  <!-- White lip glints (highlights) -->
  <g class="mouth-glints">
    <ellipse cx="270" cy="180" rx="22" ry="14" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="540" cy="180" rx="20" ry="12" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Three "shout" lines emanating from left (color-matched to lip) -->
  <g class="mouth-shoutlines">
    <ellipse class="shoutline shoutline-1" cx="60"  cy="260" rx="40" ry="8"  fill="var(--mouth-lip)"/>
    <ellipse class="shoutline shoutline-2" cx="35"  cy="320" rx="55" ry="9"  fill="var(--mouth-lip)"/>
    <ellipse class="shoutline shoutline-3" cx="55"  cy="380" rx="35" ry="7"  fill="var(--mouth-lip)"/>
  </g>

  <!-- ┄┄┄┄┄┄┄┄┄┄ STATE-MACHINE ANIMATIONS ┄┄┄┄┄┄┄┄┄┄ -->

  <style>
    /* Default: hide treatment-only layers */
    .ogz-mouth .mouth-shadow,
    .ogz-mouth .mouth-trail {
      display: none;
    }

    /* Treatment: duotone-shadow */
    .ogz-mouth[data-treatment="duotone-shadow"] .mouth-shadow {
      display: block;
    }

    /* Treatment: motion-trail */
    .ogz-mouth[data-treatment="motion-trail"] .mouth-trail,
    .ogz-mouth[data-state="trailing"] .mouth-trail {
      display: block;
    }

    /* State: resting (default — no animation) */

    /* State: shouting — shout-lines emit, staggered */
    @keyframes mouth-shout-emit {
      0%   { opacity: 0; transform: translateX(20px) scaleX(0.5); }
      40%  { opacity: 1; transform: translateX(0)   scaleX(1.2); }
      100% { opacity: 1; transform: translateX(0)   scaleX(1); }
    }
    .ogz-mouth[data-state="shouting"] .shoutline {
      transform-origin: right center;
      animation: mouth-shout-emit 320ms cubic-bezier(0.2, 0.0, 0.0, 1.0) forwards;
    }
    .ogz-mouth[data-state="shouting"] .shoutline-1 { animation-delay: 0ms; }
    .ogz-mouth[data-state="shouting"] .shoutline-2 { animation-delay: 80ms; }
    .ogz-mouth[data-state="shouting"] .shoutline-3 { animation-delay: 160ms; }

    /* State: biting — airplane animates into mouth */
    @keyframes mouth-bite-airplane {
      0%   { transform: translate(400px, -50px) scale(1.4); opacity: 0; }
      30%  { transform: translate(200px, 0px)   scale(1.2); opacity: 1; }
      70%  { transform: translate(0, 0)         scale(1);   opacity: 1; }
      100% { transform: translate(0, 0)         scale(1);   opacity: 1; }
    }
    .ogz-mouth[data-state="biting"] .mouth-airplane {
      animation: mouth-bite-airplane 640ms cubic-bezier(0.7, 0.0, 0.3, 1.0) forwards;
    }

    /* State: cycling — lip color cycles through library */
    @keyframes mouth-color-cycle {
      0%    { fill: #33EB05; }   /* electric green */
      8.3%  { fill: #000000; }   /* black */
      16.6% { fill: #F59A1F; }   /* orange */
      25%   { fill: #E602BB; }   /* epink */
      33.3% { fill: #28D9A8; }   /* mint */
      41.6% { fill: #1FBDFF; }   /* sky blue */
      50%   { fill: #C4B560; }   /* olive */
      58.3% { fill: #3349EB; }   /* electric ultramarine */
      66.6% { fill: #FFD500; }   /* yellow */
      75%   { fill: #F5BEB7; }   /* coral */
      83.3% { fill: #E8D6A0; }   /* cream */
      91.6% { fill: #BFBFBF; }   /* grey */
      100%  { fill: #33EB05; }   /* back to electric green */
    }
    .ogz-mouth[data-state="cycling"] .mouth-lip path,
    .ogz-mouth[data-state="cycling"] .shoutline {
      animation: mouth-color-cycle 1200ms linear infinite;
    }

    /* State: bleeding — viewBox pan past edge */
    @keyframes mouth-bleed-pan {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-30%); }
    }
    .ogz-mouth[data-state="bleeding"] {
      animation: mouth-bleed-pan 1200ms cubic-bezier(0.4, 0.0, 0.2, 1.0) forwards;
    }

    /* State: trailing — handled by display: block on .mouth-trail */
    @keyframes mouth-trail-fade {
      0%   { opacity: 0; }
      30%  { opacity: 0.4; }
      100% { opacity: 0; }
    }
    .ogz-mouth[data-state="trailing"] .mouth-trail use {
      animation: mouth-trail-fade 640ms cubic-bezier(0.2, 0.0, 0.0, 1.0) forwards;
    }

    /* Motion-reduce override */
    @media (prefers-reduced-motion: reduce) {
      .ogz-mouth * { animation: none !important; }
    }
  </style>
</svg>
