<!doctype html>
<!--
  Component: Deck Separator — Mouth with duotone shadow (L6)
  Layout: Mint flood + huge Epink mouth + offset shadow trail in Electric Green.
  Static but kinetic. The shadow is a SECOND mouth-color layer offset behind the primary.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OGeeZ — Separator (Duotone Shadow)</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: var(--ogz-mint);
      font-family: var(--ogz-font-en);
      color: var(--ogz-black);
      position: relative;
      overflow: hidden;
    }
    .title-block {
      position: absolute;
      left: 192px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 600px;
      z-index: 3;
    }
    .headline {
      font-size: var(--ogz-fs-display);
      line-height: var(--ogz-lh-tight);
      font-weight: var(--ogz-fw-black);
      margin: 0 0 var(--ogz-space-lg);
    }
    .subhead {
      font-size: var(--ogz-fs-h3);
      font-weight: var(--ogz-fw-regular);
      margin: 0;
    }
    .mouth-stack {
      position: absolute;
      right: 64px;
      top: 50%;
      transform: translateY(-50%);
    }
    .mouth-shadow {
      position: absolute;
      width: 1100px;
      top: 80px;
      left: -120px;
      filter: brightness(0.85) saturate(1.2);
      opacity: 0.85;
      z-index: 1;
    }
    .mouth-primary {
      position: relative;
      width: 1100px;
      z-index: 2;
    }
    .footer {
      position: absolute;
      left: var(--ogz-deck-edge-margin);
      bottom: var(--ogz-deck-footer-margin);
      font-size: var(--ogz-fs-caption);
    }
  </style>
</head>
<body data-context="house">
  <div class="title-block">
    <h1 class="headline">Separator<br>Headline</h1>
    <p class="subhead">Separator/description/title</p>
  </div>
  <div class="mouth-stack">
    <!-- Shadow layer: Electric Green mouth, offset, dimmed -->
    <img class="mouth-shadow" src="../assets/mouth/png/Mouths-01.png" alt="">
    <!-- Primary layer: Epink mouth -->
    <img class="mouth-primary" src="../assets/mouth/png/Mouths-04.png" alt="OGeeZ mouth — Epink variant">
  </div>
  <div class="footer">Presentation Title — October 20, 2023</div>
</body>
</html>
