<!doctype html>
<!--
  Component: Email Signature — Banner
  Format: horizontal banner. Lockup left. Contact center. Legal name + socials right.
  Color variants: white (default), yellow, magenta, sky-blue. Logo stays full-color.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OGeeZ — Email Signature</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #f0f0f0;
      font-family: var(--ogz-font-en);
    }
    .signature {
      width: 1400px;
      background: var(--ogz-white); /* swap to var(--ogz-yellow) / var(--ogz-epink) / var(--ogz-sky-blue) for variants */
      padding: 32px 48px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: var(--ogz-space-2xl);
      align-items: center;
    }
    .lockup img {
      width: 100%;
      height: auto;
    }
    .contact {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      font-size: 16px;
      line-height: 1.5;
    }
    .contact .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      opacity: 0.85;
    }
    .legal {
      text-align: right;
      font-size: 16px;
      line-height: 1.5;
    }
    .legal .legal-en {
      font-weight: var(--ogz-fw-bold);
      margin: 0;
    }
    .legal .legal-ar {
      font-family: var(--ogz-font-ar);
      direction: rtl;
      font-weight: var(--ogz-fw-bold);
      margin: 0 0 var(--ogz-space-md);
    }
    .socials {
      display: flex;
      align-items: center;
      gap: var(--ogz-space-md);
      justify-content: flex-end;
    }
    .social-icon {
      width: 28px;
      height: 28px;
      background: var(--ogz-black);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ogz-white);
      font-size: 16px;
      font-weight: var(--ogz-fw-bold);
    }
    .handle {
      font-weight: var(--ogz-fw-bold);
    }
  </style>
</head>
<body data-context="house">
  <div class="signature">
    <div class="lockup">
      <img src="../assets/logo/png/ON WHITEOGZ.png" alt="OGZ Studios">
    </div>
    <div class="contact">
      <span class="icon">📍</span> <span>Altawaan Dist, Riyadh, Saudi Arabia</span>
      <span class="icon">📱</span> <span>+966 581555345</span>
      <span class="icon">✉️</span> <span>info@ogzstudios.com</span>
      <span class="icon">🌐</span> <span>www.ogzstudio.com</span>
    </div>
    <div class="legal">
      <p class="legal-en">OGz Studios LLC</p>
      <p class="legal-ar">شركة الشلة الأصلية للإنتاج الفني</p>
      <div class="socials">
        <span class="social-icon" aria-label="Facebook">f</span>
        <span class="social-icon" aria-label="Instagram">⌾</span>
        <span class="social-icon" aria-label="LinkedIn">in</span>
        <span class="handle">@ogzstudios</span>
      </div>
    </div>
  </div>
</body>
</html>
