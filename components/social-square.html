<!doctype html>
<!--
  Component: Social Square (1080x1080)
  House Instagram post pattern. Color flood + mouth lockup + single-line caption.
  Bilingual sibling pair: Arabic + English at equal optical weight.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OGeeZ — Social Square</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body {
      margin: 0;
      width: 1080px;
      height: 1080px;
      background: var(--ogz-electric-green);
      font-family: var(--ogz-font-en);
      color: var(--ogz-black);
      position: relative;
      overflow: hidden;
      padding: var(--ogz-space-2xl);
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .mouth-mark {
      width: 120px;
      height: auto;
    }
    .caption {
      align-self: end;
    }
    .caption-en {
      font-size: 56px;
      line-height: 1.05;
      font-weight: var(--ogz-fw-black);
      margin: 0 0 var(--ogz-space-md);
    }
    .caption-ar {
      font-family: var(--ogz-font-ar);
      direction: rtl;
      font-size: 48px;
      line-height: 1.2;
      font-weight: var(--ogz-fw-bold);
      margin: 0;
    }
    .footer-wordmark {
      align-self: end;
      justify-self: end;
      font-size: var(--ogz-fs-caption);
      font-weight: var(--ogz-fw-medium);
    }
  </style>
</head>
<body data-context="house">
  <img class="mouth-mark" src="../assets/mouth/png/Mouths-02.png" alt="OGeeZ mouth — black">
  <div class="caption">
    <p class="caption-en">Shot in one street.<br>Three days. The street didn't notice.</p>
    <p class="caption-ar">الفيلم اتصوّر في شارع واحد. ثلاث أيام. الشارع ما لاحظش.</p>
  </div>
  <div class="footer-wordmark">@ogzstudios</div>
</body>
</html>
