<!doctype html>
<!--
  Component: Deck Cover (L1)
  Layout: White background. Mouth right ~45% (hero). Title left, mixed-case Modern Era Black.
  Date footer bottom-left light grey. NO wordmark on cover — mouth alone carries identity.
  Token usage demonstration. Replace text + mouth color (and ensure --ogz-mouth-color flows through SVG fill).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OGeeZ — Deck Cover</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    @font-face {
      font-family: "Modern Era";
      src: url("../assets/fonts/Modern Era Family/ModernEra-Black.woff2") format("woff2");
      font-weight: 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Modern Era";
      src: url("../assets/fonts/Modern Era Family/ModernEra-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: var(--ogz-white);
      font-family: var(--ogz-font-en);
      color: var(--ogz-black);
      position: relative;
      overflow: hidden;
    }
    .slide-container {
      width: 100%;
      height: 100%;
      padding: var(--ogz-deck-edge-margin);
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--ogz-space-2xl);
      align-items: center;
    }
    .title-block {
      align-self: center;
    }
    .title {
      font-size: var(--ogz-fs-display);
      line-height: var(--ogz-lh-tight);
      font-weight: var(--ogz-fw-black);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .footer {
      position: absolute;
      left: var(--ogz-deck-edge-margin);
      bottom: var(--ogz-deck-footer-margin);
      font-size: var(--ogz-fs-caption);
      color: #888;
    }
    .mouth-wrap {
      width: 100%;
      height: auto;
      max-height: 100%;
      /* Parametric mouth: set CSS color to shift the lip while fixed accents
         (magenta tooth, red tongue, airplane, sparkle, white teeth) remain. */
      color: var(--ogz-electric-green);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mouth-wrap object,
    .mouth-wrap img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body data-context="house">
  <div class="slide-container">
    <div class="title-block">
      <h1 class="title">Presentation<br>Name/Title</h1>
    </div>
    <div class="mouth-wrap">
      <!--
        PARAMETRIC MOUTH (preferred): the SVG uses currentColor for lip + shout-lines.
        Set the parent .mouth-wrap's `color` CSS property to any house token to color-shift.
        Magenta tooth highlight, red tongue, airplane, sparkle, and white teeth stay fixed.

        Fallback: <img src="../assets/mouth/png/Mouths-01.png">  // 12 pre-rendered colors available
      -->
      <object data="../assets/mouth/svg/mouth-parametric.svg" type="image/svg+xml" aria-label="OGeeZ mouth"></object>
    </div>
  </div>
  <div class="footer">October 20, 2023</div>
</body>
</html>
